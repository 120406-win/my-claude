<!DOCTYPE html><html><head><meta charset="utf-8"><title>probe self test</title></head>
<body><pre id="out">RUNNING</pre>
<script>
function studioStaticErrors(html){
  const errs = [];
  const t = String(html || '');
  if(!/<\/html>\s*$/.test(t)) errs.push('代码不完整：结尾缺少 </html>，像是写到一半被截断了，请写完整并适当控制长度');
  const open = (t.match(/<script[\s>]/gi) || []).length;
  const close = (t.match(/<\/script>/gi) || []).length;
  if(open !== close) errs.push('script 标签没有正确闭合（开始 ' + open + ' 个、结束 ' + close + ' 个），请检查每段脚本都完整结束');
  return errs;
}
function studioBuildTestDoc(html, tid){
  const probe = '<script>(function(){var errs=[];function push(m){var s=String(m||"").slice(0,240);if(s&&errs.length<8&&errs.indexOf(s)<0)errs.push(s);}window.addEventListener("error",function(e){if(e&&(e.message||e.filename))push((e.message||"脚本错误")+(e.lineno?"（第"+e.lineno+"行）":""));},true);window.addEventListener("unhandledrejection",function(e){push("未处理的 Promise 错误："+((e.reason&&e.reason.message)||e.reason||""));});window.addEventListener("load",function(){setTimeout(function(){try{parent.postMessage({type:"zephyr-studio-test",tid:"' + tid + '",errors:errs},"*");}catch(_){}} ,900);});})();<\/script>';
  if(/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + probe);
  if(/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, m => m + '<head>' + probe + '</head>');
  return '<!DOCTYPE html><html><head>' + probe + '</head><body>' + html + '</body></html>';
}
let studioTestSeq = 0;
function studioTestHtml(html){
  return new Promise(resolve => {
    const stat = studioStaticErrors(html);
    const tid = 'st' + (++studioTestSeq) + '_' + Date.now().toString(36);
    const ifr = document.createElement('iframe');
    ifr.setAttribute('sandbox', 'allow-scripts');
    ifr.style.display = 'none';
    let done = false;
    const finish = errs => { if(done) return; done = true; window.removeEventListener('message', onMsg); try{ ifr.remove(); }catch(e){} resolve(stat.concat(errs || [])); };
    const onMsg = e => { if(e.source === ifr.contentWindow && e.data && e.data.type === 'zephyr-studio-test' && e.data.tid === tid) finish(Array.isArray(e.data.errors) ? e.data.errors : []); };
    window.addEventListener('message', onMsg);
    document.body.appendChild(ifr);
    ifr.srcdoc = studioBuildTestDoc(html, tid);
    setTimeout(() => finish([]), 6000);
  });
}
</script>
<script>
(async function(){
  var lines = [];
  var broken = '<!DOCTYPE html><html><head><title>b</title></head><body><scr' + 'ipt>throw new Error("boom test");</scr' + 'ipt></body></html>';
  var good = '<!DOCTYPE html><html><head><title>g</title></head><body><scr' + 'ipt>var a=1;</scr' + 'ipt></body></html>';
  try {
    var eb = await studioTestHtml(broken);
    lines.push('BROKEN: ' + JSON.stringify(eb));
    lines.push('BROKEN_CAUGHT: ' + (eb.some(function(e){ return e.indexOf('boom test') >= 0; }) ? 'YES' : 'NO'));
    var eg = await studioTestHtml(good);
    lines.push('GOOD: ' + JSON.stringify(eg));
    lines.push('GOOD_CLEAN: ' + (eg.length === 0 ? 'YES' : 'NO'));
  } catch(e) { lines.push('EXCEPTION: ' + e.message); }
  lines.push('DONE');
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body></html>
